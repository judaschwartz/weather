<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Weather Forecast</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🌦️</text></svg>">
  <script src="index.js" defer></script>
</head>
<body>
  <button id="settings-open" class="settings-open" type="button" aria-label="Open settings" aria-haspopup="dialog" aria-controls="settings-modal" aria-expanded="false">⚙</button>
  <div id="loading">
    <div class="spinner"></div>
    <p style="color:var(--muted);font-size:.85rem">Fetching your weather…</p>
  </div>
  <div id="error">
    <p style="font-size:1.6rem">⚠️</p>
    <p id="err-msg" style="color:var(--muted);max-width:280px;line-height:1.5">Could not load weather data.</p>
  </div>
  <div id="main">
    <div id="hdr-main" class="hdr">
      <div class="hdr-left">
        <div class="cur-row">
          <div class="cur-feels" id="cur-feels"></div>
          <div class="cur-temp" id="cur-temp">—</div>
          <div class="cur-icon">
            <span id="cur-icon"></span>
            <div class="cur-desc" id="cur-desc">—</div>
          </div>
          <div class="datetime-block">
            <div class="dt-time"><span id="hdr-time">—</span><span id="hdr-seconds">—</span></div>
            <div class="dt-date">
              <h1 id="loc">—</h1>
              <div id="hdr-date">—</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="scroll">
        <table>
          <thead><tr id="d-hdr"><th scope="col">Day forecast</th></tr></thead>
          <tbody>
            <tr id="d-temp"></tr>
            <tr><td colspan="12" class="prcib-lbl">Precipitation <i>(Probability / Amount)</i></td></tr>
            <tr id="d-precip"></tr>
            <tr><td colspan="12" class="wind-lbl">Wind speed (MPH)</td></tr>
            <tr id="d-wind"></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div id="hourly-day-label"></div>
      <div class="scroll hourly-wrap">
        <table>
          <thead><tr id="h-temp"></tr><tr id="h-hdr"><th scope="col">Hourly forecast</th></tr></thead>
          <tbody>
            <tr><td colspan="24" class="wind-lbl">Wind speed (MPH)</td></tr>
            <tr id="h-wind"></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div id="zmanim-grid"></div>
  </div>
    <dialog id="settings-modal" class="settings-modal" aria-labelledby="settings-title">
      <div class="settings-backdrop" data-close-settings="true"></div>
      <div class="settings-panel">
        <div class="settings-body">
          <section class="settings-section" aria-label="Display settings">
            <p class="settings-label">Display</p>
            <div class="settings-actions">
              <button class="unit-btn settings-btn" type="button" onclick="toggleUnits()">Switch Units (°F / °C)</button>
              <button class="rfr-btn settings-btn" type="button" onclick="location.reload()">Refresh Screen</button>
            </div>
          </section>
          <section class="settings-section" aria-label="Location settings">
            <p class="settings-label">Location (ZIP code or name)</p>
            <form class="loc-form settings-loc-form" onsubmit="changeLocation(event)">
              <input id="loc-input" class="loc-input" type="text" inputmode="text" autocomplete="postal-code" placeholder="ZIP code or city name">
              <button id="loc-btn" class="loc-btn" type="submit">Apply</button>
            </form>
            <br><p class="settings-label">Recent</p>
            <div id="preset-links"></div>
          </section>
        </div>
      </div>
    </dialog>
</body>
</html>
