<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=portrait">
  <title>Weather Forecast</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🌦️</text></svg>">
  <script src="index.js" defer></script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p style="color:var(--muted);font-size:.85rem">Fetching your weather…</p>
  </div>
  <div id="error">
    <p style="font-size:1.6rem">⚠️</p>
    <p id="err-msg" style="color:var(--muted);max-width:280px;line-height:1.5">Could not load weather data.</p>
    <button class="retry-btn" onclick="init()">Try Again</button>
    <form class="loc-form" style="justify-content: center;" onsubmit="changeLocation(event)" style="margin-top: 16px;">
      <input id="zip-input-error" class="zip-input" type="text" inputmode="text" autocomplete="postal-code" placeholder="ZIP code">
      <button id="zip-btn-error" class="zip-btn" type="submit">Change Location</button>
    </form>
  </div>
  <div id="main">
    <div class="hdr">
      <div class="hdr-left">
        <h1 id="loc">—</h1>
        <div class="cur-row">
          <div class="cur-feels" id="cur-feels"></div>
          <div class="cur-temp" id="cur-temp">—</div>
          <div>
            <span class="cur-icon" id="cur-icon"></span>
            <div class="cur-desc" id="cur-desc">—</div>
          </div>
          <div class="datetime-block">
            <div class="dt-time"><span id="hdr-time">—</span><span id="hdr-seconds">—</span></div>
            <div class="dt-date" id="hdr-date">—</div>
          </div>
        </div>
      </div>
      <div class="hdr-controls">
        <div class="top-row">
          <button class="rfr-btn" type="button" onclick="refresh()">⟳</button>
          <button class="unit-btn" onclick="toggleUnits()">°F / °C</button>
          <form class="loc-form" onsubmit="changeLocation(event)">
            <input id="zip-input" class="zip-input" type="text" inputmode="text" autocomplete="postal-code" placeholder="ZIP code">
            <button id="zip-btn" class="zip-btn" type="submit">Change Location</button>
          </form>
        </div>
        <div class="preset-links">
          <a href="?location=Cleveland+Heights%2C+OH">CLE</a>
          <a href="?location=08701">Lakewood</a>
          <a href="?location=21209">Baltimore</a>
          <a href="?location=60659">Chicago</a>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="scroll">
        <table>
          <thead><tr id="d-hdr"><th scope="col">Day forecast</th></tr></thead>
          <tbody>
            <tr id="d-temp"></tr>
            <tr id="d-precip"></tr>
            <tr id="d-wind"></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div id="hourly-day-label"></div>
      <div class="scroll hourly-wrap">
        <table>
          <thead><tr id="h-hdr"><th scope="col">Hourly forecast</th></tr></thead>
          <tbody>
            <tr id="h-temp"></tr>
            <tr id="h-precip"></tr>
            <tr id="h-wind"></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
